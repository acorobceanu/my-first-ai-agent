spring:
  application:
    name: profession-aptitude-api
  datasource:
    url: jdbc:h2:mem:aptitude;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aptitude:
  max-questions: 15
